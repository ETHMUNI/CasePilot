name: CI

on:
  pull_request:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  python-checks:
    name: Python checks
    runs-on: ubuntu-latest
    env:
      CASEPILOT_ENV: test
      CASEPILOT_TEST_DATABASE: casepilot_test
      POSTGRES_DB: casepilot
      POSTGRES_HOST: 127.0.0.1
      POSTGRES_PASSWORD: ci-only-password
      POSTGRES_PORT: "5432"
      POSTGRES_USER: casepilot
    services:
      postgres:
        image: pgvector/pgvector:pg16
        env:
          POSTGRES_DB: casepilot
          POSTGRES_USER: casepilot
          POSTGRES_PASSWORD: ci-only-password
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U casepilot -d casepilot"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    steps:
      - name: Check out repository
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version-file: backend/.python-version

      - name: Set up uv
        uses: astral-sh/setup-uv@c18668ad3cf93ea998bef934396af7bb5c839dc7 # v10.2.0
        with:
          version: 0.12.24
          enable-cache: true
          cache-dependency-glob: backend/uv.lock

      - name: Install locked dependencies
        working-directory: backend
        run: uv sync --locked --dev

      - name: Create isolated integration-test database
        env:
          PGPASSWORD: ci-only-password
        run: psql -h 127.0.0.1 -U casepilot -d casepilot -c 'CREATE DATABASE casepilot_test'

      - name: Apply migrations to integration-test database
        working-directory: backend
        run: POSTGRES_DB=casepilot_test uv run alembic upgrade head

      - name: Ruff lint
        working-directory: backend
        run: uv run ruff check .

      - name: Ruff format check
        working-directory: backend
        run: uv run ruff format --check .

      - name: Type check
        working-directory: backend
        run: uv run mypy

      - name: Unit tests
        working-directory: backend
        run: uv run pytest tests/unit -q

      - name: Integration tests
        working-directory: backend
        run: uv run pytest tests/integration -q
